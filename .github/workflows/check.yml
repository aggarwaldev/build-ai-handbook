name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Internal links
        run: python3 tools/check_links.py

      - name: Book structure and banned words
        run: python3 tools/check_book.py

      - name: Search index is up to date
        run: python3 tools/build_search_index.py --check

      - name: Notebooks match their sources and every lab page links them
        run: python3 tools/build_notebooks.py --check

      - name: Page heads, sitemap and robots.txt are up to date
        run: python3 tools/build_site_meta.py --check

      - name: Progress tracker tests
        run: node --test tools/tests/*.test.js

      - name: Install the lab requirements
        run: python -m pip install -r labs/requirements.txt -r labs/06-mcp-server/requirements.txt "nbclient>=0.10" "nbformat>=5.10" "ipykernel>=6.29"

      - name: Lab tests
        working-directory: labs
        env:
          LLM_BACKEND: fake
        run: python -m pytest

      - name: Every notebook runs on the fake backend
        env:
          LLM_BACKEND: fake
        run: python tools/run_notebooks.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium outside the repository
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.49.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Progress tracker in a real browser
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          REQUIRE_BROWSER: "1"
        run: node --test tools/tests/browser.test.js
